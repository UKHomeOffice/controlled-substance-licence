---
kind: pipeline
name: default
type: kubernetes

environment:
  APP_NAME: csl
  PROD_ENV: sas-csl-prod
  STG_ENV: sas-csl-stg
  UAT_ENV: sas-csl-uat
  BRANCH_ENV: sas-csl-branch
  PRODUCTION_URL: www.licensing-for-controlled-substances.homeoffice.gov.uk
  IMAGE_URL: 340268328991.dkr.ecr.eu-west-2.amazonaws.com
  IMAGE_REPO: sas/csl
  GIT_REPO: UKHomeOffice/controlled-substance-licence
  HOF_CONFIG: hof-services-config/Controlled_Substance_License
  NON_PROD_AVAILABILITY: Mon-Fri 08:00-23:00 Europe/London
  READY_FOR_TEST_DELAY: 20s
  NOTIFY_STUB: stub
  REDIS_PERSISTENCE_ENABLED: "true"
  REDIS_PERSISTENCE_ACCESS_MODES: ReadWriteOnce
  REDIS_PERSISTENCE_STORAGE_CLASS: gp2-encrypted-eu-west-2b
  REDIS_PERSISTENCE_EXISTING_CLAIM: ""
  REDIS_PERSISTENCE_ANNOTATIONS_FILE: ""

include_default_branch: &include_default_branch
  include:
    - master

include_default_and_feature_branches: &include_default_and_feature_branches
  include:
    - master
    - feature/*
    - deps-*
    - CSL-*

trigger:
  branch:
    <<: *include_default_and_feature_branches

node_image_name: &node_image_name quay.io/ukhomeofficedigital/hof-nodejs:24.22.3_1-alpine@sha256:8533bcedc2dc86aceadaa8bab422931e8a33a81504c67247392eeffec6603cd5

node_image: &node_image
  pull: if-not-exists
  image: *node_image_name

linting: &linting
  <<: *node_image
  commands:
    - yarn run test:lint

unit_tests: &unit_tests
  <<: *node_image
  environment:
    NOTIFY_STUB: true
  commands:
    - yarn run test:unit

sonar_scanner: &sonar_scanner
  pull: always
  image: quay.io/ukhomeofficedigital/sonar-scanner:latest
  commands:
    - sonar-scanner -Dproject.settings=./sonar-project.properties

github_app_token_step: &github_app_token_step
  pull: if-not-exists
  image: *node_image_name
  volumes:
    - name: dockersock
      path: /root/.dockersock
  commands:
    - apk add --no-cache bash curl jq openssl
    - test -n "$GITHUB_APP_ID" || (echo "Missing GITHUB_APP_ID secret." && exit 1)
    - test -n "$GITHUB_APP_PRIVATE_KEY" || (echo "Missing GITHUB_APP_PRIVATE_KEY secret." && exit 1)
    - test -n "$GITHUB_APP_INSTALLATION_ID" || (echo "Missing GITHUB_APP_INSTALLATION_ID secret." && exit 1)
    - test -n "$OUTPUT_TOKEN_FILE" || (echo "Missing OUTPUT_TOKEN_FILE." && exit 1)
    - bash bin/generate_github_app_token.sh

github_app_token_secrets_ukho: &github_app_token_secrets_ukho
  GITHUB_APP_ID:
    from_secret: hof_ukho_gh_app_id
  GITHUB_APP_PRIVATE_KEY:
    from_secret: hof_ukho_gh_app_pk
  GITHUB_APP_INSTALLATION_ID:
    from_secret: hof_ukho_gh_app_install_id

github_app_token_secrets_hof: &github_app_token_secrets_hof
  GITHUB_APP_ID:
    from_secret: HOF_GH_APP_ID
  GITHUB_APP_PRIVATE_KEY:
    from_secret: HOF_GH_APP_PK
  GITHUB_APP_INSTALLATION_ID:
    from_secret: HOF_GH_APP_INSTALL_ID

clone_repos_step: &clone_repos_step
  image: alpine/git
  volumes:
    - name: dockersock
      path: /root/.dockersock
  commands:
    - test -s "$CLONE_TOKEN_FILE" || (echo "$CLONE_TOKEN_MISSING_MESSAGE" && exit 1)
    - export GITHUB_TOKEN="$(cat "$CLONE_TOKEN_FILE")"
    - git clone https://x-access-token:$${GITHUB_TOKEN}@github.com/UKHomeOfficeForms/hof-services-config.git
    - if [ "${CLONE_REPOS_PRUNE:-false}" = "true" ]; then find hof-services-config/* | grep -v $HOF_CONFIG | grep -v 'infrastructure' | xargs rm -rf; fi
    - rm -f "$CLONE_TOKEN_FILE"

steps:
  - name: generate_github_app_token_for_clone
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone.txt
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: clone_repos
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone.txt
      CLONE_TOKEN_MISSING_MESSAGE: Missing GitHub App token file for clone step.
      CLONE_REPOS_PRUNE: "true"
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - generate_github_app_token_for_clone

  # Trivy Security Scannner for scanning OS related vulnerabilities in Base image of Dockerfile
  - name: scan_base_image_os
    pull: always
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: *node_image_name
      SERVICE_URL: https://acp-trivy-helm.acp-trivy.svc.cluster.local:443
      SEVERITY: MEDIUM,HIGH,CRITICAL  --dependency-tree
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    volumes:
      - name: dockersock
        path: /root/.dockersock
    when:
      event: [push, pull_request]
    depends_on:
      - clone_repos

  - name: setup
    <<: *node_image
    environment:
      NOTIFY_STUB: true
    commands:
      - yarn install --frozen-lockfile
      - yarn run postinstall
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: linting
    <<: *linting
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup

  - name: unit_tests
    <<: *unit_tests
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - setup

  - name: sonar_scanner
    <<: *sonar_scanner
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]

  - name: build_image_for_trivy
    pull: if-not-exists
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
      # wait for docker service to be up before running docker build
      - /usr/local/bin/wait
      - docker build --no-cache -t $${IMAGE_REPO}:$${DRONE_COMMIT_SHA} .
    volumes:
      - name: dockersock
        path: /var/run
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - linting
      - unit_tests

  - name: build_image_and_push_to_ecr
    pull: if-not-exists
    image: plugins/ecr
    settings:
      access_key:
        from_secret: aws_access_key_id
      secret_key:
        from_secret: aws_secret_access_key
      region: eu-west-2
      repo: sas/csl
      registry: 340268328991.dkr.ecr.eu-west-2.amazonaws.com
      tags:
        - ${DRONE_COMMIT_SHA}
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: [push, pull_request]
    depends_on:
      - linting
      - unit_tests
      - build_image_for_trivy

  # Trivy Security Scannner for scanning nodejs packages in Yarn
  - name: scan_node_packages
    pull: always
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    resources:
      limits:
        cpu: 1000
        memory: 1024Mi
    environment:
      IMAGE_NAME: sas/csl:${DRONE_COMMIT_SHA}
      SEVERITY: MEDIUM,HIGH,CRITICAL  --dependency-tree --format table
      FAIL_ON_DETECTION: true
      IGNORE_UNFIXED: false
      ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    volumes:
      - name: dockersock
        path: /root/.dockersock
    when:
      event: [push, pull_request]
    depends_on:
      - build_image_for_trivy

  # Deploy to pull request UAT environment
  - name: deploy_to_branch
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      # NOTIFY_STUB: stub
      KUBE_SERVER:
        from_secret: KUBE_SERVER_DEV
      KUBE_TOKEN:
        from_secret: KUBE_TOKEN_DEV
      REDIS_PERSISTENCE_ENABLED: "false"
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - bin/deploy.sh $${BRANCH_ENV}
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
    depends_on:
      - clone_repos
      - build_image_and_push_to_ecr

  - name: e2e_tests
    pull: if-not-exists
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    environment:
      SAS_HOF_EMAIL:
        from_secret: SAS_HOF_EMAIL
      PASSWORD_CDA:
        from_secret: PASSWORD_CDA
      PASSWORD_LTHCC:
        from_secret: PASSWORD_LTHCC
      PASSWORD_PCA:
        from_secret: PASSWORD_PCA
      PASSWORD_PENDING:
        from_secret: PASSWORD_PENDING
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - rm -rf allure-results allure-report
      - npm install -g n
      - n 24.22.3
      - hash -r
      - node --version
      - yarn install --frozen-lockfile
      - yarn playwright install --with-deps
      - apt-get update && apt-get install -y --no-install-recommends default-jre-headless
      - test -s /root/.dockersock/branch_url.txt || (echo "Missing deployed branch URL at /root/.dockersock/branch_url.txt" && exit 1)
      - echo "Running Playwright e2e against https://$(cat /root/.dockersock/branch_url.txt)"
      - |
        set +e
        CI=true PLAYWRIGHT_BASE_URL="https://$(cat /root/.dockersock/branch_url.txt)" yarn test:e2e
        test_exit_code=$?
        report_exit_code=1
        if [ -d allure-results ] && find allure-results -name '*-result.json' -print -quit | grep -q .; then
          yarn allure:generate
          report_exit_code=$?
        else
          echo "No Allure test results were produced; report cannot be generated." >&2
        fi
        if [ "$test_exit_code" -ne 0 ]; then exit "$test_exit_code"; fi
        exit "$report_exit_code"
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
    depends_on:
      - deploy_to_branch

  - name: generate_github_app_token_for_e2e_report
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_ukho
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_e2e_report.txt
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
      status:
        - success
        - failure
    depends_on:
      - e2e_tests

  - name: publish_e2e_report_to_pr
    pull: if-not-exists
    image: *node_image_name
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - |
        set -euo pipefail
        token_file=/root/.dockersock/github_app_token_for_e2e_report.txt
        trap 'rm -f "$token_file"' EXIT
        apk add --no-cache bash curl jq
        test -n "$DRONE_PULL_REQUEST" || (echo "Missing DRONE_PULL_REQUEST. This step only supports pull_request builds." && exit 1)
        export DRONE_REPO="$${DRONE_REPO:-$GIT_REPO}"
        test -n "$DRONE_REPO" || (echo "Missing repository slug (DRONE_REPO/GIT_REPO)." && exit 1)
        test -s "$token_file" || (echo "Missing GitHub App token file from generate_github_app_token_for_e2e_report step." && exit 1)
        export GITHUB_APP_TOKEN="$(cat "$token_file")"
        bash bin/publish_e2e_test_report.sh
    when:
      branch:
        <<: *include_default_and_feature_branches
      event: pull_request
      status:
        - success
        - failure
    depends_on:
      - generate_github_app_token_for_e2e_report

  - name: deploy_to_uat
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: KUBE_SERVER_DEV
      KUBE_TOKEN:
        from_secret: KUBE_TOKEN_DEV
      REDIS_PERSISTENCE_ENABLED: "false"
    commands:
      - sh bin/deploy.sh $${UAT_ENV}
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - clone_repos
      - build_image_and_push_to_ecr

  # Get pull request branch so correct PR UAT environment is torn down in the tear_down_branch step that follows
  - name: get_pr_branch
    pull: if-not-exists
    image: drone/cli:alpine@sha256:14409f7f7247befb9dd2effdb2f61ac40d1f5fbfb1a80566cf6f2f8d21f3be11
    environment:
      DRONE_SERVER:
        from_secret: DRONE_SERVER
      DRONE_TOKEN:
        from_secret: DRONE_TOKEN
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - drone build info $GIT_REPO $DRONE_BUILD_NUMBER --format {{.Message}} | grep -o '[^ ]\+$' -m1 | sed 's|UKHomeOffice/||g' | tr '[:upper:]' '[:lower:]' | tr '/' '-' > /root/.dockersock/branch_name.txt
    when:
      branch:
        <<: *include_default_branch
      event: push

  # Tear down pull request UAT environment
  - name: tear_down_branch
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: KUBE_SERVER_DEV
      KUBE_TOKEN:
        from_secret: KUBE_TOKEN_DEV
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - bin/deploy.sh tear_down
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - get_pr_branch
      - deploy_to_uat

   # Deploy to Staging environment
  - name: deploy_to_stg
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: KUBE_SERVER_PROD
      KUBE_TOKEN:
        from_secret: KUBE_TOKEN_PROD
      REDIS_PERSISTENCE_ENABLED: "true"
    commands:
      - bin/deploy.sh $${STG_ENV}
    when:
      branch:
        <<: *include_default_branch
      event: push
    depends_on:
      - clone_repos
      - build_image_and_push_to_ecr

  ## Checks that a build being promoted has passed and is on the default branch, indicating a healthy build
  - name: sanity_check_build_prod
    pull: if-not-exists
    image: drone/cli:alpine@sha256:14409f7f7247befb9dd2effdb2f61ac40d1f5fbfb1a80566cf6f2f8d21f3be11
    environment:
      DRONE_SERVER:
        from_secret: DRONE_SERVER
      DRONE_TOKEN:
        from_secret: DRONE_TOKEN
    commands:
      - bin/sanity_check_build.sh
    when:
      target: PROD
      event: promote

  - name: generate_github_app_token_for_clone_prod
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_prod.txt
    when:
      target: PROD
      event: promote
    depends_on:
      - sanity_check_build_prod

  - name: clone_repos_prod
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_prod.txt
      CLONE_TOKEN_MISSING_MESSAGE: Missing GitHub App token file for PROD clone step.
    when:
      target: PROD
      event: promote
    depends_on:
      - generate_github_app_token_for_clone_prod

  # Deploy to Production environment
  - name: deploy_to_prod
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: KUBE_SERVER_PROD
      KUBE_TOKEN:
        from_secret: KUBE_TOKEN_PROD
      REDIS_PERSISTENCE_ENABLED: "true"
    commands:
      - bin/deploy.sh $${PROD_ENV}
    when:
      target: PROD
      event: promote
    depends_on:
      - clone_repos_prod

  # CRON job step that tears down our pull request UAT environments
  - name: cron_tear_down
    pull: if-not-exists
    image: quay.io/ukhomeofficedigital/kd:v1.14.0
    environment:
      KUBE_SERVER:
        from_secret: KUBE_SERVER_DEV
      KUBE_TOKEN:
        from_secret: KUBE_TOKEN_DEV
    commands:
      - bin/clean_up.sh $${BRANCH_ENV}
    when:
      cron: tear_down_pr_envs
      event: cron

  # CRON job steps that runs security scans using Trivy
  - name: generate_github_app_token_for_clone_cron
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_hof
      OUTPUT_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_cron.txt
    when:
      cron: security_scans
      event: cron

  - name: cron_clone_repos
    <<: *clone_repos_step
    environment:
      CLONE_TOKEN_FILE: /root/.dockersock/github_app_token_for_clone_cron.txt
      CLONE_TOKEN_MISSING_MESSAGE: Missing GitHub App token file for CRON clone step.
      CLONE_REPOS_PRUNE: "true"
    when:
      cron: security_scans
      event: cron
    depends_on:
      - generate_github_app_token_for_clone_cron

  - name: cron_build_image
    pull: if-not-exists
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind
    commands:
      # wait for docker service to be up before running docker build
      - /usr/local/bin/wait
      - docker build --no-cache -t $${IMAGE_REPO}:$${DRONE_COMMIT_SHA} .
    volumes:
      - name: dockersock
        path: /var/run
    when:
      cron: security_scans
      event: cron
    depends_on:
      - cron_clone_repos

  - name: cron_trivy_scan_node_packages
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    pull: always
    environment:
        IMAGE_NAME: sas/csl:${DRONE_COMMIT_SHA}
        SERVICE_URL: https://acp-trivy-helm.acp-trivy.svc.cluster.local:443
        SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --dependency-tree
        FAIL_ON_DETECTION: true
        IGNORE_UNFIXED: false
        ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    when:
      cron: security_scans
      event: cron
      status:
        - success
        - failure
    depends_on:
      - cron_build_image

  - name: cron_trivy_scan_image_os
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/trivy/client:latest
    pull: always
    environment:
        IMAGE_NAME: *node_image_name
        SEVERITY: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --dependency-tree
        FAIL_ON_DETECTION: true
        IGNORE_UNFIXED: false
        ALLOW_CVE_LIST_FILE: hof-services-config/infrastructure/trivy/.trivyignore.yaml
    when:
      cron: security_scans
      event: cron
    depends_on:
      - cron_clone_repos

  - name: cron_nightly_e2e_tests
    pull: if-not-exists
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    environment:
      NIGHTLY_E2E_BASE_URL:
        from_secret: NIGHTLY_E2E_BASE_URL
      SAS_HOF_EMAIL:
        from_secret: SAS_HOF_EMAIL
      PASSWORD_CDA:
        from_secret: PASSWORD_CDA
      PASSWORD_LTHCC:
        from_secret: PASSWORD_LTHCC
      PASSWORD_PCA:
        from_secret: PASSWORD_PCA
      PASSWORD_PENDING:
        from_secret: PASSWORD_PENDING
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - rm -f /root/.dockersock/nightly-playwright-run-output.txt /root/.dockersock/nightly-playwright-report.json /root/.dockersock/nightly-playwright-summary.txt /root/.dockersock/nightly-playwright-summary.json /root/.dockersock/nightly-playwright-exit-code.txt /root/.dockersock/nightly-allure-report-url.txt
      - rm -rf allure-results allure-report
      - npm install -g n
      - n 24.22.3
      - hash -r
      - node --version
      - yarn install --frozen-lockfile
      - yarn playwright install --with-deps
      - apt-get update && apt-get install -y --no-install-recommends default-jre-headless
      - |
        set +e
        run_output_path="/root/.dockersock/nightly-playwright-run-output.txt"
        json_output_path="/root/.dockersock/nightly-playwright-report.json"
        summary_output_path="/root/.dockersock/nightly-playwright-summary.txt"
        summary_json_path="/root/.dockersock/nightly-playwright-summary.json"
        exit_code_path="/root/.dockersock/nightly-playwright-exit-code.txt"
        test_exit_code=1
        reported_exit_code=unavailable

        if [ -z "$NIGHTLY_E2E_BASE_URL" ]; then
          echo "Missing NIGHTLY_E2E_BASE_URL secret." | tee "$run_output_path"
        else
          case "$NIGHTLY_E2E_BASE_URL" in
            http://*|https://*) base_url="$NIGHTLY_E2E_BASE_URL" ;;
            *) base_url="https://$NIGHTLY_E2E_BASE_URL" ;;
          esac
          echo "Using PLAYWRIGHT_BASE_URL=$base_url"

          yarn bddgen > "$run_output_path" 2>&1
          bddgen_exit_code=$?
          if [ "$bddgen_exit_code" -eq 0 ]; then
            CI=true PLAYWRIGHT_BASE_URL="$base_url" PLAYWRIGHT_JSON_OUTPUT_NAME="$json_output_path" \
              yarn playwright test --reporter=line,json,allure-playwright >> "$run_output_path" 2>&1
            test_exit_code=$?
            reported_exit_code=$test_exit_code
          else
            test_exit_code=$bddgen_exit_code
            echo "Playwright tests were not started because BDD generation failed." >> "$run_output_path"
          fi
        fi

        printf '%s:%s\n' "$DRONE_BUILD_NUMBER" "$reported_exit_code" > "$exit_code_path"
        status_write_exit_code=$?
        if [ -s "$run_output_path" ]; then
          tail -n 60 "$run_output_path"
        fi

        node bin/summarise_playwright_report.js \
          "$json_output_path" "$summary_output_path" "$reported_exit_code" \
          "$summary_json_path" "$DRONE_BUILD_NUMBER"
        summary_exit_code=$?

        report_exit_code=1
        if [ -d allure-results ] && find allure-results -name '*-result.json' -print -quit | grep -q .; then
          yarn allure:generate
          report_exit_code=$?
        else
          echo "No Allure test results were produced; report cannot be generated." >&2
        fi

        if [ "$test_exit_code" -ne 0 ]; then exit "$test_exit_code"; fi
        if [ "$status_write_exit_code" -ne 0 ]; then exit "$status_write_exit_code"; fi
        if [ "$summary_exit_code" -ne 0 ]; then exit "$summary_exit_code"; fi
        exit "$report_exit_code"
    when:
      cron: nightly_e2e_playwright
      event: cron

  - name: cron_generate_github_app_token_for_report
    <<: *github_app_token_step
    environment:
      <<: *github_app_token_secrets_ukho
      OUTPUT_TOKEN_FILE: /root/.dockersock/nightly-report-token.txt
    when:
      cron: nightly_e2e_playwright
      event: cron
      status: [success, failure]
    depends_on:
      - cron_nightly_e2e_tests

  - name: cron_publish_nightly_allure_report
    <<: *node_image
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - apk add --no-cache bash curl jq
      - rm -f /root/.dockersock/nightly-allure-report-url.txt
      - test -s /root/.dockersock/nightly-report-token.txt || (echo "Missing GitHub App report token file" && exit 1)
      - |
        token_file=/root/.dockersock/nightly-report-token.txt
        trap 'rm -f "$token_file"' EXIT
        export DRONE_REPO="$${DRONE_REPO:-$GIT_REPO}"
        export GITHUB_APP_TOKEN="$(cat "$token_file")"
        unset DRONE_PULL_REQUEST
        REPORT_URL_FILE=/root/.dockersock/nightly-allure-report-url.txt \
          bash bin/publish_e2e_test_report.sh
    when:
      cron: nightly_e2e_playwright
      event: cron
      status: [success, failure]
    depends_on:
      - cron_generate_github_app_token_for_report
      - cron_nightly_e2e_tests

  - name: cron_notify_slack_nightly_e2e
    <<: *node_image
    environment:
      SLACK_WEBHOOK:
        from_secret: slack_sas_hof_e2e_tests_webhook
      NIGHTLY_E2E_BASE_URL:
        from_secret: NIGHTLY_E2E_BASE_URL
    volumes:
      - name: dockersock
        path: /root/.dockersock
    commands:
      - apk add --no-cache curl jq
      - test -n "$SLACK_WEBHOOK" || (echo "Missing slack_sas_hof_e2e_tests_webhook secret." && exit 1)
      - |
        summary_path=/root/.dockersock/nightly-playwright-summary.txt
        summary_json_path=/root/.dockersock/nightly-playwright-summary.json
        exit_code_path=/root/.dockersock/nightly-playwright-exit-code.txt
        if [ ! -s "$summary_path" ]; then
          printf '%s\n' \
            'Passed: N/A No Of Tests: N/A' \
            'Failed: N/A No Of Tests: N/A' \
            'Flaky: N/A No Of Tests: N/A' \
            'Skipped: N/A No Of Tests: N/A' \
            'Total Results Reported: unknown' \
            'Results: INVALID (Playwright summary artifact is missing)' > "$summary_path"
        fi

        test_status=Failed
        saved_exit_code=""
        if [ -s "$exit_code_path" ]; then
          saved_exit_code="$(cat "$exit_code_path")"
        fi
        summary_passed=""
        if [ -s "$summary_json_path" ]; then
          summary_passed="$(jq -er --arg build "$DRONE_BUILD_NUMBER" \
            'select(.valid == true and .buildNumber == $build and .playwrightExitCode == 0) | "passed"' \
            "$summary_json_path" 2>/dev/null || true)"
        fi
        if [ "$saved_exit_code" = "$DRONE_BUILD_NUMBER:0" ] && [ "$summary_passed" = "passed" ]; then
          test_status=Passed
        elif ! grep -q '^Results: INVALID' "$summary_path"; then
          printf '%s\n' \
            'Results: INVALID (Playwright exit status is missing, invalid, or belongs to another build)' \
            >> "$summary_path"
        fi

        test_color=danger
        if [ "$test_status" = "Passed" ]; then
          test_color=good
        fi

        environment="not configured"
        if [ -n "$NIGHTLY_E2E_BASE_URL" ]; then
          case "$NIGHTLY_E2E_BASE_URL" in
            http://*|https://*) environment_url="$NIGHTLY_E2E_BASE_URL" ;;
            *) environment_url="https://$NIGHTLY_E2E_BASE_URL" ;;
          esac
          environment="$environment_url"
        fi
        report_link="View Test Report: unavailable (Allure report was not published)"
        if [ -s /root/.dockersock/nightly-allure-report-url.txt ]; then
          report_url="$(cat /root/.dockersock/nightly-allure-report-url.txt)"
          report_link="View Test Report: <$report_url|View Test Report> (downloads the single-file Allure HTML report)"
        fi

        payload=$(jq -n \
          --arg test_status "$test_status" \
          --arg test_color "$test_color" \
          --arg status "${DRONE_BUILD_STATUS:-unknown}" \
          --arg branch "${DRONE_BRANCH:-unknown}" \
          --arg environment "$environment" \
          --arg build_link "${DRONE_BUILD_LINK:-}" \
          --arg build_number "${DRONE_BUILD_NUMBER:-unknown}" \
          --arg report_link "$report_link" \
          --rawfile summary "$summary_path" \
          '{
            text: ("****************** Start of CSL Test Report ******************\nNightly Playwright Tests\nStatus: " + $test_status),
            attachments: [{
              color: $test_color,
              mrkdwn_in: ["text"],
              text: (
                "Service Name: controlled-substance-licence\n" +
                "Service Abbreviation: CSL\n" +
                "Status: " + $status + "\n" +
                "Branch: " + $branch + "\n" +
                "Environment: " + $environment + "\n" +
                "Build: <" + $build_link + "|#" + $build_number + ">\n" +
                "Test Status: " + $test_status + "\n\n" +
                "Test Results:\n" + $summary + "\n" +
                $report_link + "\n\n" +
                "****************** End of CSL Test Report ******************"
              )
            }]
          }')
        curl --fail-with-body -sS -X POST -H 'Content-Type: application/json' \
          --data "$payload" "$SLACK_WEBHOOK"
    when:
      cron: nightly_e2e_playwright
      event: cron
      status:
        - success
        - failure
    depends_on:
      - cron_publish_nightly_allure_report

  # Slack notification upon a CRON job fail
  - name: cron_notify_slack_tear_down_pr_envs
    pull: if-not-exists
    image: plugins/slack:1.4.1
    settings:
      channel: sas-hof-build-notify
      failure: ignore
      icon.url: https://readme.drone.io/logo.svg
      template: >
            *✘ {{ uppercasefirst build.status }}*: CRON Job `tear_down_pr_envs` for *Controlled Substance Licence Suite* has failed.

            Branch <https://github.com/{{ repo.owner }}/{{ repo.name }}/commits/{{ build.branch }}|{{build.branch}}> | Commit <https://github.com/{{ repo.owner }}/{{ repo.name }}/commit/{{ build.commit }}|{{ truncate build.commit 8 }}>

            *Build <{{build.link}}|#{{build.number}}>*
      username: Drone_CI
      webhook:
        from_secret: slack_sas_hof_build_notify_webhook
    when:
      cron: tear_down_pr_envs
      event: cron
      status:
        - failure
    depends_on:
      - cron_tear_down

  - name: cron_notify_slack_security_scans
    pull: if-not-exists
    image: plugins/slack:1.4.1
    settings:
      channel: sas-hof-security
      failure: ignore
      icon.url: https://readme.drone.io/logo.svg
      template: >
            *✘ {{ uppercasefirst build.status }}*: CRON Job `security_scans` for *Controlled Substance Licence Suite* has failed.

            Branch <https://github.com/{{ repo.owner }}/{{ repo.name }}/commits/{{ build.branch }}|{{build.branch}}> | Commit <https://github.com/{{ repo.owner }}/{{ repo.name }}/commit/{{ build.commit }}|{{ truncate build.commit 8 }}>

            *Build <{{build.link}}|#{{build.number}}>*
      username: Drone_CI
      webhook:
        from_secret: slack_sas_hof_security_webhook
    when:
      cron: security_scans
      event: cron
      status:
        - failure
    depends_on:
      - cron_trivy_scan_image_os
      - cron_trivy_scan_node_packages

services:
  - name: docker
    image: 340268328991.dkr.ecr.eu-west-2.amazonaws.com/acp/dind

  # Redis session setup in background so ui integration tests can run
  - name: session
    image: redis
    volumes:
      - name: dockersock
        path: /var/run

volumes:
  - name: dockersock
    temp: {}
