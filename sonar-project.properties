sonar.projectKey=Controlled-substance-licence
sonar.projectName=Controlled-substance-licence
sonar.sources=apps,assets/js,bin,utils
sonar.exclusions=bin/*,coverage/*,node_modules/*, apps/*/index.js, apps/*/fields/index.js, apps/*/sections/summary-data-sections.js
sonar.coverage.exclusions=apps/common/index.js
sonar.tests=test
sonar.test.inclusions=test/**/*.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Ignore rules that conflict with team conventions
sonar.issue.ignore.multicriteria=e1
# S7726: "The arrow function should be named" (anonymous default-exported arrow functions are accepted here)
# https://github.com/SonarSource/SonarJS/tree/master/packages/analysis/src/jsts/rules/S7726
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S7726
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js
